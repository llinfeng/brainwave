<!DOCTYPE html>
<html lang="en">
<head>
    <title>Brainwave-locally-hosted</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="static/style.css">
</head>
<body>
    <div class="container">
        <div id="connectionStatus" class="connection-status"></div>
        <button id="themeToggle" class="theme-toggle">🌙</button>
        <h1 id="statusHeading">ready</h1>
        <div id="timer" style="text-align: center; margin-bottom: 15px; font-size: 1.2rem;">00:00</div>
        
        <!-- Soundwave Visualization -->
        <div class="soundwave-container">
            <canvas id="soundwaveCanvas" width="600" height="80"></canvas>
        </div>
        
        <div class="mode-toggle-container">
            <label class="mode-label" for="modelSelect">Backend:</label>
            <select id="modelSelect" class="model-select">
                <option value="restful" style="color: #1a7f37;">🟢 gpt-4o-transcribe (REST) · 0.6¢/min&nbsp;&nbsp;&nbsp;&nbsp;faithful</option>
                <option value="realtime" style="color: #d97706;">🟠 gpt-realtime-1.5 (Realtime) · 6¢/min&nbsp;&nbsp;&nbsp;&nbsp;fast</option>
            </select>
        </div>
        <div class="record-button-container">
<div class="tooltip-container"><button id="uploadButton" class="upload-button">Upload (Realtime)</button><span class="tooltip-text">Upload a WAV, replayed through the Realtime API. Model: gpt-realtime-1.5. Matches the Realtime dropdown option.<span class="tooltip-price">~6.0 ¢/min</span></span></div>
            <button id="recordButton">Start</button>
<div class="tooltip-container"><button id="whisperUploadButton" class="upload-button">Upload (Transcribe)</button><span class="tooltip-text">Upload a WAV, transcribed via REST (/v1/audio/transcriptions). Model: gpt-4o-transcribe. Matches the gpt-4o-transcribe dropdown option.<span class="tooltip-price">~0.6 ¢/min</span></span></div>
            <input type="file" id="fileInput" accept=".wav" style="display: none;">
            <input type="file" id="whisperFileInput" accept=".wav" style="display: none;">
        </div>
        <div class="transcript-container">
            <textarea id="transcript"></textarea>
            <button id="copyButton" class="copy-button">Copy</button>
        </div>
        <div class="button-container">
            <button id="readabilityButton" class="action-button">Readability</button>
            <button id="correctnessButton" class="action-button">Correctness</button>
            <button id="askAIButton" class="action-button">Ask AI</button>
        </div>
        <div class="enhanced-transcript-container">
            <textarea id="enhancedTranscript"></textarea>
            <button id="copyEnhancedButton" class="copy-button">Copy</button>
        </div>
    </div>
    <script src="static/main.js"></script>
</body>
</html>
